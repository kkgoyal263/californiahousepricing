name: Build Docker Container

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f Dockerfile.vercel -t californiahousepricing .

      - name: Test Docker image
        run: |
          docker run -d \
            --name californiahousepricing \
            -e PORT=5000 \
            -p 5000:5000 \
            californiahousepricing

          sleep 10
          curl --fail http://localhost:5000

          docker stop californiahousepricing